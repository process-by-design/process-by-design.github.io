<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messenger demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}html,body,#root{height:100%}body{background:#000;color:#fff;font:15px/1.4 "Hanken Grotesk","Helvetica Neue",Arial,sans-serif}.app{display:flex;flex-direction:column;height:100%}.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.msg{max-width:84%;padding:10px 14px;border-radius:18px;white-space:pre-line}.bot{background:#1c1c1c;align-self:flex-start}.me{background:#fff;color:#000;align-self:flex-end}.dots{color:#888;letter-spacing:.2em}.replies{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 16px;min-height:24px}.replies button{background:none;color:#fff;border:1.5px solid #fff;border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}.replies button:hover,.replies button:focus-visible{background:#fff;color:#000;outline:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
var PATHS=[
  {t:"The FAQ pilot",to:"p1"},
  {t:"Navigating Open Messaging",to:"p2"},
  {t:"Learning good governance",to:"p3"}
];
function remaining(v){var r=PATHS.filter(function(p){return !v[p.to]});return r.length?r:[{t:"Start again",to:"start"}]}
var nodes={
  start:{bot:"Hi, I’m Jack, Digital Curator.\n\nI build and design bots and customer experiences, whilst providing and acting upon insights and finding ways to deploy faster and safer.\n\nBelow you’ll find a few options which will explore where I started, as well as some early challenges, and where I am today.",replies:function(){return PATHS}},
  p1:{bot:["The FAQ pilot was the bank's first venture into chatbots, a simple web messenger was placed on the bank’s savings account’s product page.","It's where I got to grips with the basics: Architect message flows, digital bot flows, knowledge and bot analytics."],replies:[{t:"Where are we now?",to:"p1b"}]},
  p1b:{bot:["Since February 2026, I’ve introduced triage bots, developed and integrated travel notification and transaction dispute tools which reduced banker effort, introduced knowledge that contains almost half of all interactions within the bot (with no banker involved), which forms just part of the bot’s overall ~65% business hours containment rate each month.","I’ve achieved this all whilst preparing for the bank to develop integrations into their CRMs, which will enable agentic agents to evolve from just reducing, to eliminating banker effort.","Chat has exponentially grown as a channel since bots were first introduced. Today, there are more chat interactions than voice; however, the channel has become efficient enough to require significantly fewer chat agents than voice agents.","This is as a result of orchestrating various tools and specialists knowledge, from Operative Intelligence insights to my experience as a training facilitator and a decade spent in retail environments."],replies:[{t:"What am I working on right now?",to:"p1c"}]},
  p1c:{bot:["As of November 2026, I'm currently preparing several simultaneous releases.",{t:"One gives customers an additional channel to discuss new home loan applications.",d:2000},{t:"Another is a low-cost, temporary internet banking chat that relies on banker process. My contact centre SME knowledge made that possible, and it works around the technical limits on integration and authentication.",d:2000},{t:"I'm updating our existing authenticated in-app chat, which removes the after-hours channel and makes our knowledge bots available all hours of the day and night.",d:2500},{t:"And I'm working on an agentic virtual agent (AVA) with a near-complete servicing knowledge of our home loan products.",d:2500}],replies:remaining},
  p2:{bot:["The Bank’s Open Messaging middleware began as a literal blank slate.","When I was first appointed as the bank’s ‘Digital Curator’, everyone who engaged with the channel went straight to a banker, with disclaimers delivered through data tables.","That led to countless ‘blank’ interactions and resulted in numerous banker inefficiencies.","The bespoke Open Messaging environment limited how many bots I could release at first. So I released short but effective triage conversations instead. Sometimes all it takes is a bot asking no more than “how can we help you?” - although by no means was that ever treated as the finish line.","I ultimately partnered with the mobile app team responsible for the middleware, and together we resolved the outstanding technical issues."],replies:[{t:"Where are we now?",to:"p2b"}]},
  p2b:{bot:["I helped develop quick replies that when present, locks the keyboard.","That matters in a regulated bank. A written expression of hardship or a complaint that goes un-actioned could result in regulatory action.","With no free text during the triage experience (right up until they’re passed to a banker), there's nothing to miss.","I worked with the mobile app team to build an experience that does more than route customers. It reduces the bank’s regulatory risk as well."],replies:remaining},
  p3:{bot:["I built relationships with risk and compliance stakeholders and brought them along for the journey.","I applied their feedback and gave them visual technical demonstrations, which later proved useful in developing knowledge bases for AI agents."],replies:[{t:"Where are we now?",to:"p3b"}]},
  p3b:{bot:["I've deployed enough releases that they now qualify as a \"standard change\". That means faster implementation and less formal documentation.","Because the risk is well understood, each release moves through a lighter process.","That speed makes it possible to run several releases at once, without each one starting from scratch.","It's built on the trust from the governance work: the relationships with risk and compliance, and the feedback I applied along the way."],replies:[{t:"What's next?",to:"p3c"}]},
  p3c:{bot:["With the business's limited AI tools, I replicated programs like Cursor inside basic AI models, by creating dedicated AI agents with comprehensive knowledge bases.","Only because governance required so much documentation did I have the material to feed those agents."],replies:[{t:"What can the agent do?",to:"p3d"}]},
  p3d:{bot:["It can write and complete test cases, amend and create chatbot scripts in the expected formats, and create spec docs that carry between AI conversations, all while ensuring the human is kept in the loop.","With imported YAML files, it also gives technical guidance that would otherwise be limited by one SME's knowledge and experience, often enabling the previously thought impossible."],replies:remaining}
};
var h=React.createElement,useState=React.useState,useEffect=React.useEffect,useRef=React.useRef;
function App(){var a=useState([]),msgs=a[0],setMsgs=a[1];var b=useState(null),node=b[0],setNode=b[1];var c=useState(false),typing=c[0],setTyping=c[1];var visited=useRef({}),end=useRef(null);
function say(lines,i,done){var l=lines[i],text=typeof l==="string"?l:l.t,wait=typeof l==="string"?650:l.d;setTyping(true);setTimeout(function(){setMsgs(function(m){return m.concat([{who:"bot",t:text}])});setTyping(false);if(i+1<lines.length){say(lines,i+1,done)}else{done()}},wait)}
function go(id){if(id==="start")visited.current={};else if(id==="p1"||id==="p2"||id=== "p3")visited.current[id]=true;setNode(null);var lines=nodes[id].bot;if(!Array.isArray(lines))lines=[lines];say(lines,0,function(){setNode(id)})}
function pick(r){setMsgs(function(m){return m.concat([{who:"me",t:r.t}])});go(r.to)}
useEffect(function(){go("start")},[]);useEffect(function(){end.current&&end.current.scrollIntoView({block:"end"})},[msgs,typing,node]);
var rep=[];if(node){var r=nodes[node].replies;rep=typeof r=== "function"?r(visited.current):r}
return h("div",{className:"app"},h("div",{className:"log"},msgs.map(function(m,i){return h("div",{key:i,className:"msg "+m.who},m.t)}),typing&&h("div",{className:"msg bot dots","aria-label":"Typing"},"..."),h("div",{ref:end})),h("div",{className:"replies"},rep.map(function(r){return h("button",{key:r.t,onClick:function(){pick(r)}},r.t)})))}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
