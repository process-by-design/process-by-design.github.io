<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jack Appleton – Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Six+Caps&family=Hanken+Grotesk:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{--display:"Six Caps",Impact,"Arial Narrow",sans-serif;--text:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-snap-type:y proximity}
body{background:#000;color:#fff;font-family:var(--text);-webkit-font-smoothing:antialiased}
.page{min-height:100svh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column}
.cover{align-items:center;justify-content:center;text-align:center;padding:clamp(1.5rem,6vw,5rem)}
.year{font-style:italic;font-size:clamp(.85rem,1.4vw,1rem);margin-bottom:.5rem}
.name{font-family:var(--display);font-weight:400;line-height:.72;font-size:clamp(4.5rem,17vw,11rem);letter-spacing:.01em}
.surname{display:block;position:relative;color:#bdbdbd;font-size:.52em;line-height:.8;margin-top:.3em}
.pill{font-style:italic;font-weight:400;font-size:clamp(.85rem,1.4vw,1rem);border:1.5px solid #fff;border-radius:999px;padding:.55em 1.3em;margin-top:2.5rem}
.demo-page{align-items:center;justify-content:center;padding:clamp(1.5rem,6vw,5rem);background:#fff;gap:1rem}
.demo-heading{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:#444;font-weight:700}
.chat-frame{width:min(100%,360px);aspect-ratio:9/14;background:#000;border:1.5px solid #fff;overflow:hidden}
.chat-frame iframe{width:100%;height:100%;border:0;display:block}
@media(max-width:760px){.demo-page{padding:4.5rem 1rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="page cover" id="top">
<p class="year">2026</p>
<h1 class="name">JACK<span class="surname">APPLETON</span></h1>
<p class="pill">Progress by design</p>
</header>
<main class="page demo-page" id="demo">
<p class="demo-heading">Portfolio conversation</p>
<div class="chat-frame"><iframe src="demo-messenger.html" title="Interactive conversation with Jack Appleton" loading="eager"></iframe></div>
</main>
<section class="page demo-page" id="virtual-curator">
<p class="demo-heading">Virtual Curator · Internal governance demo</p>
<div class="chat-frame"><iframe src="demo-curator.html" title="Virtual Curator internal audit, testing and governance demo" loading="eager"></iframe></div>
</section>
</body>
</html>
