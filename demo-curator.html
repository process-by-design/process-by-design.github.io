<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Curator — Internal demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}html,body,#app{height:100%}body{background:#000;color:#fff;font:14px/1.45 "Hanken Grotesk","Helvetica Neue",Arial,sans-serif}.app{height:100%;display:flex;flex-direction:column}.topbar{padding:10px 14px;border-bottom:1px solid #292929;font-size:12px;color:#ccc;letter-spacing:.04em}.log{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px}.msg{max-width:88%;padding:9px 12px;border-radius:16px;white-space:pre-line;overflow-wrap:anywhere}.bot{background:#1c1c1c;align-self:flex-start}.me{background:#fff;color:#000;align-self:flex-end}.note{background:#fff1b8;color:#332800;align-self:flex-start;font-size:12px;border:1px solid #e8d98c}.note strong{display:block;margin-bottom:3px}.replies{display:flex;flex-wrap:wrap;gap:7px;padding:8px 12px 12px;border-top:1px solid #292929;max-height:34%;overflow-y:auto}.replies button,.file-label{background:#000;color:#fff;border:1px solid #eee;border-radius:999px;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}.replies button:hover,.replies button:focus-visible,.file-label:hover{background:#fff;color:#000;outline:none}.file-input{display:none}.muted{color:#aaa;font-size:11px}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
var app=document.getElementById('app'),log,replies,uploadedText='',uploadedName='',caseName='',approval='',riskRef='Not supplied in this demo',testList=[];
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function add(who,text){var n=el('div','msg '+who,text);log.appendChild(n);log.scrollTop=log.scrollHeight}
function note(text){var n=el('div','msg note');var b=el('strong','', 'Curator note · benefit and rationale');n.appendChild(b);n.appendChild(document.createTextNode(text));log.appendChild(n);log.scrollTop=log.scrollHeight}
function clearReplies(){replies.replaceChildren()}
function buttons(items){clearReplies();items.forEach(function(item){var b=el('button','',item.label);b.type='button';b.onclick=item.run;replies.appendChild(b)})}
function user(text){add('me',text)}
function bot(text){add('bot',text)}
function choice(label,fn){return{label:label,run:function(){user(label);fn()}}}
function showCases(){bot('Hi, I’m the Virtual Curator. I support internal auditing, testing and governance for bot and agentic-knowledge work. I am not customer-facing: I can recommend and draft, but you review and own decisions.\n\nWhat would you like to work on?');note('Starting with the use case keeps the review focused. Human owners remain accountable for decisions, approvals and release.');buttons([
choice('Automating Daylight Savings Messaging',function(){startCase('Automating Daylight Savings Messaging')}),
choice('Updating the chatbot’s script',function(){startCase('Updating the chatbot’s script')}),
choice('Creating knowledge for agentic agents',function(){startCase('Creating knowledge for agentic agents')}),
choice('Start over',function(){reset()})])}
function startCase(c){caseName=c;uploadedText='';uploadedName='';approval='';bot('Use case selected: '+c+'. What outcome should this work achieve, and what is in scope? Add the affected flow, audience or knowledge topic, intended behaviour, and any constraints. Do not include customer personal information.');note('A concise scope and intended outcome make the risk check, review and tests traceable.');buttons([choice('Continue with a concise demo brief',function(){riskCheck()}),choice('Add details later; continue draft',function(){riskCheck()})])}
function riskCheck(){bot('I’ll check the case against the relevant internal risk documentation. Based on the criteria supplied for these three use cases, none requires an additional risk assessment. Please provide or identify the current risk document and section; this demo has no internal-document access.');note('The no-additional-assessment conclusion comes from the stated criteria, not an independent policy lookup. A conflict in the actual documentation must be escalated for human review.');buttons([choice('Use the stated criteria for this draft',function(){riskRef='User-stated criteria; document reference still to be added';approvalCheck()}),choice('Pause to verify the internal criteria',function(){bot('Please check the applicable internal risk document with its owner, then return with the document name, version and section. No assessment decision is made in this demo.');buttons([choice('Continue draft; reference to follow',function(){riskRef='Pending owner confirmation';approvalCheck()}),choice('Choose another use case',showCases)])})])}
function approvalCheck(){bot('Which reviews or approvals apply? Select the best current view. I’ll record it as a draft for confirmation, not as approval granted.');buttons([choice('Platform + Business unit leader + SME review',function(){approval='Platform, business unit leader and SME review — applicability to confirm'}),choice('Platform + SME review',function(){approval='Platform and SME review — applicability to confirm'}),choice('Business unit leader + SME review',function(){approval='Business unit leader and SME review — applicability to confirm'}),choice('SME review only',function(){approval='SME review — applicability to confirm'}),choice('None identified / not sure',function(){approval='None identified or not sure — confirm against approval guidance'})]);
var check=el('button','', 'Continue');check.onclick=function(){user('Continue with approval selection');if(!approval){approval='Not yet determined';}technicalCheck()};replies.appendChild(check)}
function technicalCheck(){if(caseName==='Creating knowledge for agentic agents'){knowledgeSource();return}bot('Does this use case involve a technical bot-flow build?');buttons([choice('Yes — I can provide the YAML',function(){askFile('yaml')}),choice('No — content or process only',function(){uploadedText='';tests()}),choice('Not sure — request YAML for review',function(){askFile('yaml')})])}
function askFile(kind){var isYaml=kind==='yaml';bot(isYaml?'Please attach the relevant exported YAML file. I’ll look for text evidence related to the use case and suggest review points. A file review is not proof of deployed behaviour or a passed runtime test.':'Please attach approved knowledge source material, such as website index HTML, an internal page, Markdown or text. I’ll draft approximate article structure and identify gaps; source content must be confirmed by an SME.');note(isYaml?'A YAML export can help trace a test to configured nodes or values. I’ll label limited text matches as observations, not semantic validation.':'Grounding articles in approved source files reduces unsupported or invented guidance.');clearReplies();var wrap=el('div','');var input=el('input','file-input');input.type='file';input.accept=isYaml?'.yaml,.yml,.txt,.md':' .html,.htm,.txt,.md,.yaml,.yml';input.onchange=function(){var f=input.files&&input.files[0];if(!f)return;uploadedName=f.name;f.text().then(function(t){uploadedText=t;user('Attached locally: '+f.name);bot('I have read the selected file in this browser session. It is not uploaded to a server by this prototype. I’ll use it only as supplied source text and will identify what still needs human review.');if(isYaml)tests();else knowledgeDraft()}).catch(function(){bot('I could not read that file in this browser. You can try a text-based YAML, HTML, Markdown or TXT file, or continue without one.');askFile(kind)})};var label=el('label','file-label','Choose '+(isYaml?'YAML':'source')+' file');label.appendChild(input);replies.appendChild(label);buttonsAfterUpload(isYaml)}
function buttonsAfterUpload(isYaml){var b=el('button','','Continue without file');b.onclick=function(){user('Continue without file');uploadedText='';uploadedName='';if(isYaml)tests();else knowledgeDraft()};replies.appendChild(b)}
function tests(){testList=caseName==='Automating Daylight Savings Messaging'?[
['DST-01','Before transition','Approved pre-transition schedule and wording are used.'],['DST-02','At transition boundary','No unintended duplicate, skipped or incorrectly timed message.'],['DST-03','After transition','Approved post-transition schedule and wording are used.'],['DST-04','Relevant market/time zone','Behaviour matches the confirmed market requirement.'],['DST-05','Wording changed (if applicable)','Approved copy appears in the intended flow.']]:[
['SCRIPT-01','Changed prompt','Approved wording appears in the correct context.'],['SCRIPT-02','Each quick reply or branch','Each selection follows the intended path.'],['SCRIPT-03','Handoff condition (if applicable)','Expected handoff occurs with required context.'],['SCRIPT-04','Unchanged path','Existing behaviour remains as expected.'],['SCRIPT-05','Unexpected or incomplete response','The agreed fallback path is used.']];
var out='Draft test cases for review (not executed):\n\n'+testList.map(function(t){return t[0]+' — '+t[1]+'\nExpected: '+t[2]+'\nStatus: Needs execution'}).join('\n\n');bot(out);if(uploadedText){var terms=caseName.indexOf('Daylight')>=0?/(daylight|saving|schedule|time.?zone|message)/i:/(prompt|message|quick.?reply|handoff|transition|node)/i;var lines=uploadedText.split(/\r?\n/),hits=[];for(var i=0;i<lines.length&&hits.length<5;i++){if(terms.test(lines[i].trim()))hits.push(lines[i].trim().slice(0,200))}bot('YAML evidence review · '+uploadedName+'\n'+(hits.length?'Potential text matches (inspect the referenced flow/node manually):\n• '+hits.join('\n• '):'No obvious text matches found for the search terms. This simple demo does not parse or validate YAML structure.')+'\n\nResult: configuration observations only. Runtime tests remain “Needs execution” until test-run evidence is supplied.');note('Separating configured evidence from execution results prevents an export from being mistaken for a successful live test.')}else{bot('No YAML was supplied, so configuration evidence is unavailable. Test status remains “Needs execution”; add the relevant export and execution results before recording a pass.')}note('Reviewing unchanged paths and fallbacks helps catch unintended effects of a seemingly small change.');specPrompt()}
function knowledgeSource(){bot('For agentic knowledge, what topic should we start with? A broad example is home loan variations, which may include splitting loan facilities and property substitutions. Please provide approved source material, such as website index files or internal knowledge pages.');note('A broad entry point can clarify customer intent; topic-specific articles can then carry detailed source-backed guidance.');buttons([choice('Start broad: home loan variations',function(){caseName='Creating knowledge for agentic agents — home loan variations';askFile('source')}),choice('I have source files to attach',function(){askFile('source')}),choice('Choose a different topic later',function(){askFile('source')})])}
function knowledgeDraft(){var src=uploadedName?'Source provided: '+uploadedName+'. Source-derived content needs human confirmation.':'No approved source file supplied; this is a structure-only example. Do not use as customer guidance.';bot('Approximate draft article — Home loan variations\n\nStatus: Draft; SME review required. '+src+'\n\nUse this document when… a customer asks generally about changing an existing home loan and the agent needs to identify the type of variation.\n\nDon’t use this document for… confirming eligibility, fees, timeframes, requirements, product rules or approval outcomes; making a lending decision; or replacing an approved application or specialist process.\n\nCustomer phrasings to consider:\n• “Can I change my home loan?”\n• “Can I split my loan?”\n• “Can I change the property securing my loan?”\n\nGuidance: Ask what the customer wants to change. Do not assume the variation type or promise an outcome. Use only a specific approved article or handoff process once confirmed.\n\nSource gaps for SME confirmation: supported variation types, eligibility and assessment criteria, documents, fees, timeframes, application steps and handoff route. No bank-specific rules have been invented.');note('The article separates intent discovery from specific product guidance. Unsupported rules are explicitly left as gaps until approved source material and SME review are available.');buttons([choice('Create separate articles for splitting facilities and property substitutions',function(){bot('Proposed article split:\n1. Splitting home loan facilities — draft only after approved sources are supplied.\n2. Property substitutions — draft only after approved sources are supplied.\n\nEach article should include use this / don’t use this, customer phrasings, source references, clarifying questions, approved guidance and handoff criteria.');knowledgeTests()}),choice('Keep the broad overview for now',knowledgeTests),choice('Add another variation topic',function(){bot('Please record the requested topic in the spec and provide its approved source material before drafting guidance.');knowledgeTests()})])}
function knowledgeTests(){bot('Draft knowledge tests for review (not executed):\n\nKNOW-01 — “Can I change my home loan?” Expected: ask which variation the customer means.\nKNOW-02 — “Can I split my loan?” Expected: use a dedicated approved splitting-facilities article if available.\nKNOW-03 — “Can I move my loan to another property?” Expected: identify possible property substitution without promising eligibility.\nKNOW-04 — Unsupported variation. Expected: don’t invent an answer; follow approved clarification or handoff.\nKNOW-05 — Fees or timeframes absent from sources. Expected: don’t guess; follow agreed next step.\n\nStatus: Needs execution. Verify retrieval and answer behaviour against approved sources.');if(uploadedText){bot('Source file noted: '+uploadedName+'. This prototype does not extract or verify all source statements. Please review article wording against the file and obtain SME approval before use.')}note('Tests check that the agent recognises uncertainty and stays within approved knowledge, not just that it can produce an answer.');specPrompt()}
function specPrompt(){bot('Before we finish, create or update a spec so the decisions and evidence persist. This demo can prepare a representation; it does not save a real document.');note('A maintained spec preserves rationale, source versions, approvals, test evidence and open questions for the next reviewer.');buttons([choice('Create a new spec draft',function(){showSpec('New spec draft')}),choice('Update an existing spec',function(){showSpec('Proposed update to existing spec')}),choice('Not now — show missing items',function(){showSpec('Spec checklist / pending update')})])}
function showSpec(kind){bot(kind+'\n\nUse case: '+caseName+'\nRisk basis: '+riskRef+'\nApproval/review status: '+(approval||'Not yet determined')+'\nSource / YAML file: '+(uploadedName||'Not provided')+'\nTests: Drafted; runtime execution evidence is still required.\nOpen items: internal-document reference, confirmed approvals, owner, version, SME review, test evidence and next actions.\n\nPlease copy this representation into your maintained spec and complete the missing fields.');note('Updating the spec now keeps the session auditable and makes remaining work visible.');buttons([choice('Promote this update to my spec',function(){user('I’ll update the maintained spec');bot('Spec update promoted: record the use case, risk-document reference, approval decisions, source/YAML version, test cases, execution evidence, open questions, owner and next action in your maintained document. This demo has not saved it automatically.');closeChoices()}),choice('Return to use-case menu',showCases)])}
function closeChoices(){bot('Before closing: please update your spec with the decisions, evidence and unresolved items from this session. What would you like to work on next?');buttons([choice('Start another use case',showCases),choice('Finish',function(){bot('Thanks. The human owner remains responsible for confirming sources, approvals, test results and the final spec update.');clearReplies()})])}
function reset(){log.replaceChildren();uploadedText='';uploadedName='';showCases()}
app.className='app';var bar=el('div','topbar','VIRTUAL CURATOR  /  INTERNAL GOVERNANCE PROTOTYPE');log=el('div','log');replies=el('div','replies');app.appendChild(bar);app.appendChild(log);app.appendChild(replies);showCases();
})();
</script>
</body>
</html>
